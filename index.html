<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f6f5f2">
<title>省時記帳</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#222;--mute:#888;--acc:#3b6ef5;--g:#1f9d60;--r:#e5533d;--line:#eee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif}
button{font:inherit;cursor:pointer;color:inherit}.hide{display:none!important}
.wrap{max-width:480px;margin:0 auto;padding:16px 14px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:6px 0 4px}h2{font-size:16px;margin:0 0 2px}.sub{color:var(--mute);font-size:14px;margin:0 0 14px;line-height:1.5}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:#eef2ff;color:var(--acc);margin-left:6px;vertical-align:middle}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 6px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px;background:#fff}
.row2{display:flex;gap:8px}.row2>div{flex:1}
.time{display:flex;gap:6px;align-items:center}.time input{text-align:center}.time span{color:var(--mute);font-size:13px;white-space:nowrap}
.tabs{display:flex;background:#e9e8e4;border-radius:12px;padding:4px;margin-bottom:12px}.tabs button{flex:1;border:none;background:none;padding:10px;border-radius:9px}
.tabs button.sel{background:#fff;box-shadow:0 1px 3px #0002;font-weight:600}
.opt{display:flex;gap:8px;margin-top:10px}.opt button{flex:1;padding:12px 8px;border-radius:10px;border:2px solid #ddd;background:#fff;font-size:14px;line-height:1.3}
.opt button.sel{border-color:var(--acc);background:#eef2ff}.opt small{display:block;color:var(--mute);font-size:11px}
.primary{width:100%;padding:15px;border:none;border-radius:12px;background:var(--acc);color:#fff;font-size:16px;margin-top:4px}
.ghost{border:none;background:var(--card);border-radius:10px;padding:8px 12px;box-shadow:0 1px 3px #0001;font-size:14px}
.err{color:var(--r);font-size:13px;min-height:18px;margin:4px 0}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav{border:none;background:var(--card);border-radius:10px;width:42px;height:42px;font-size:20px;box-shadow:0 1px 3px #0001}
.big{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 8px}
.big div{background:var(--card);border-radius:12px;padding:12px;box-shadow:0 1px 3px #0001}.big b{display:block;font-size:20px;margin-top:2px}.big span{font-size:12px;color:var(--mute)}
.rate{background:var(--ink)!important;color:#fff;grid-column:1/3}.rate span{color:#bbb!important}
.brk{font-size:13px;color:var(--mute);margin:0 2px 12px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:12px;color:var(--mute);padding:4px 0}
.day{background:var(--card);border-radius:10px;min-height:58px;padding:5px 4px;border:2px solid transparent;box-shadow:0 1px 2px #0001;text-align:left;overflow:hidden}
.day.empty{background:transparent;box-shadow:none}.day.today{border-color:var(--acc)}.day.off{background:#efeee9}
.day .n{font-size:13px;font-weight:600}.day .v{font-size:10px;margin-top:2px;line-height:1.25;white-space:nowrap}
.pos{color:var(--g)}.neg{color:var(--r)}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:9}
.modal.on{display:flex}.sheet{background:var(--bg);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.close{float:right;border:none;background:none;font-size:26px;color:var(--mute);line-height:1}
.cmp{font-size:13px;margin-top:10px;padding:10px;border-radius:10px;background:#f6f7fb;line-height:1.5}
.total{font-size:14px;line-height:1.6}
</style></head><body>

<div id="setup" class="wrap hide">
 <h1>先設定你平時的做法</h1>
 <p class="sub">這裡填你平時「便宜但費時」的做法：搭公共交通、自己煮晚餐。之後每天改用 Uber 或外賣時，app 會算出你多花了多少錢、換回多少時間。</p>
 <div class="card"><h2>個人資料</h2>
  <div class="row2"><div><label>姓名</label><input id="pName" placeholder="你的名字"></div><div style="flex:.6"><label>年齡</label><input id="pAge" type="number" inputmode="numeric" min="1" placeholder="30"></div></div>
 </div>
 <div class="tabs" id="setTabs"><button data-t="work" class="sel">上班日</button><button data-t="off">下班日</button></div>
 <div id="setForm"></div>
 <div class="err" id="setErr"></div>
 <button class="primary" id="setSave">保存設定</button>
</div>

<div id="main" class="wrap hide">
 <header><div class="sub" style="margin:0" id="hello"></div><button class="ghost" id="editSet">⚙️ 平時做法</button></header>
 <header style="margin-top:10px"><button class="nav" id="prev">‹</button><h1 id="title" style="margin:0;font-size:20px"></h1><button class="nav" id="next">›</button></header>
 <div class="big">
  <div><span>本月為省時多花</span><b id="sMoney" class="neg">$0</b></div>
  <div><span>本月換回時間</span><b id="sTime" class="pos">0小時0分</b></div>
  <div class="rate"><span>平均每換回 1 小時，你付出</span><b id="sRate">–</b></div>
 </div>
 <div class="brk" id="brk"></div>
 <div class="grid" id="grid"></div>
 <p class="sub" style="margin-top:12px;font-size:12px">每格顯示當天換回的時間（綠）和多花的錢（紅）。灰底是下班日。</p>
</div>

<div class="modal" id="modal"><div class="sheet">
 <button class="close" id="close">×</button><h2 id="mTitle" style="font-size:18px;margin-bottom:10px"></h2>
 <div class="tabs" id="dayTabs"><button data-t="work">上班日</button><button data-t="off">下班日</button></div>
 <div id="dayForm"></div>
 <div class="card total" id="dayTotal"></div>
 <div class="err" id="dayErr"></div>
 <button class="primary" id="daySave">儲存這一天</button>
 <button class="ghost" id="dayClear" style="width:100%;margin-top:8px;color:var(--r)">清除這天紀錄</button>
</div></div>

<script>
const K='timesaver-v3';let S=JSON.parse(localStorage.getItem(K)||'null')||{profile:null,base:null,days:{}};
const persist=()=>localStorage.setItem(K,JSON.stringify(S));
const ITEMS=[{k:'go',lab:{work:'上班通勤',off:'出門交通'},slow:'公共交通',fast:'計程車或Uber',grp:'通勤'},
             {k:'back',lab:{work:'下班通勤',off:'回家交通'},slow:'公共交通',fast:'計程車或Uber',grp:'通勤'},
             {k:'dinner',lab:{work:'晚餐',off:'晚餐'},slow:'自己煮',fast:'外賣/出外用膳',grp:'晚餐',note:'包括買餸、煮飯、洗碗的時間'}];
const $=id=>document.getElementById(id);
const hm=m=>{m=Math.round(Math.abs(m));const h=Math.floor(m/60),mi=m%60;return h?`${h}小時${mi}分`:`${mi}分`};
const sh=m=>{m=Math.round(Math.abs(m));return `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`};
const money=v=>'$'+(Math.round(Math.abs(v)*10)/10).toLocaleString();
const timeInputs=(id,min)=>`<div class="time"><input id="${id}h" type="number" inputmode="numeric" min="0" value="${min!=null?Math.floor(min/60):''}" placeholder="0"><span>小時</span><input id="${id}m" type="number" inputmode="numeric" min="0" max="59" value="${min!=null?min%60:''}" placeholder="0"><span>分</span></div>`;
const readTime=id=>{const h=$(id+'h').value,m=$(id+'m').value;if(h===''&&m==='')return null;if(+h<0||+m<0||+m>59)return NaN;return (+h||0)*60+(+m||0)};
const readAmt=id=>{const a=$(id).value;if(a===''||+a<0)return null;return +a};

// ---------- 設定 ----------
let setType='work',draft={work:null,off:null};
function setHTML(t,vals){return ITEMS.map(it=>{const v=(vals&&vals[it.k])||{};return `<div class="card"><h2>${it.lab[t]}<span class="tag">${it.slow}</span></h2>
 ${it.note?`<div class="sub" style="margin:4px 0 0;font-size:12px">${it.note}</div>`:''}
 <div class="row2"><div><label>消費（港元）</label><input id="s${it.k}a" type="number" inputmode="decimal" min="0" step="0.1" value="${v.amt??''}" placeholder="${it.k=='dinner'?'40':'12'}"></div></div>
 <label>所花時間</label>${timeInputs('s'+it.k+'t',v.min)}</div>`}).join('')}
function readSet(){const o={};for(const it of ITEMS){const a=readAmt('s'+it.k+'a'),t=readTime('s'+it.k+'t'),l=it.lab[setType];
 if(a==null)return [null,`請輸入「${l}」的消費`];if(t==null)return [null,`請輸入「${l}」所花時間`];if(isNaN(t))return [null,`「${l}」的分鐘請輸入 0–59`];o[it.k]={amt:a,min:t}}return [o,null]}
function showSetup(){$('main').classList.add('hide');$('setup').classList.remove('hide');window.scrollTo(0,0);
 if(S.profile){$('pName').value=S.profile.name;$('pAge').value=S.profile.age}draft={work:S.base?.work||null,off:S.base?.off||null};renderSet()}
function renderSet(){$('setTabs').querySelectorAll('button').forEach(b=>b.classList.toggle('sel',b.dataset.t==setType));$('setForm').innerHTML=setHTML(setType,draft[setType]);$('setErr').textContent=''}
$('setTabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{const [v]=readSet();if(v)draft[setType]=v;setType=b.dataset.t;renderSet()});
$('setSave').onclick=()=>{const n=$('pName').value.trim(),a=$('pAge').value;
 if(!n)return $('setErr').textContent='請輸入姓名';if(!a||+a<1)return $('setErr').textContent='請輸入年齡';
 const [v,e]=readSet();if(e)return $('setErr').textContent=(setType=='work'?'上班日：':'下班日：')+e;draft[setType]=v;
 for(const t of ['work','off'])if(!draft[t]){setType=t;renderSet();return $('setErr').textContent=`請也填好「${t=='work'?'上班日':'下班日'}」的所有項目`}
 S.profile={name:n,age:+a};S.base={work:draft.work,off:draft.off};persist();showMain()};

// ---------- 月曆 ----------
let cur=new Date();cur.setDate(1);let selKey=null,dayType='work',dayDraft={};
const key=(y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const defType=k=>{const d=new Date(k+'T00:00').getDay();return d==0||d==6?'off':'work'};
function calc(rec){const b=S.base[rec.type];let dm=0,dt=0,g={通勤:{dm:0,dt:0},晚餐:{dm:0,dt:0}};
 for(const it of ITEMS){const r=rec.items[it.k];if(r&&r.fast){const m=r.amt-b[it.k].amt,t=b[it.k].min-r.min;dm+=m;dt+=t;g[it.grp].dm+=m;g[it.grp].dt+=t}}return {dm,dt,g}}
function showMain(){$('setup').classList.add('hide');$('main').classList.remove('hide');$('hello').textContent=`你好，${S.profile.name}`;render()}
function render(){const y=cur.getFullYear(),m=cur.getMonth();$('title').textContent=`${y}年${m+1}月`;
 const gr=$('grid');gr.innerHTML='';'日一二三四五六'.split('').forEach(d=>gr.innerHTML+=`<div class="dow">${d}</div>`);
 const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),t=new Date();let TM=0,TT=0,G={通勤:{dm:0,dt:0,n:0},晚餐:{dm:0,dt:0,n:0}};
 for(let i=0;i<first;i++)gr.innerHTML+='<div class="day empty"></div>';
 for(let d=1;d<=days;d++){const k=key(y,m,d),r=S.days[k],tp=r?r.type:defType(k);let inner='';
  if(r){const c=calc(r);TM+=c.dm;TT+=c.dt;for(const n in c.g){G[n].dm+=c.g[n].dm;G[n].dt+=c.g[n].dt}
   for(const it of ITEMS)if(r.items[it.k]?.fast)G[it.grp].n++;
   if(c.dm||c.dt)inner=`<div class="v ${c.dt>=0?'pos':'neg'}">${c.dt>=0?'+':'-'}${sh(c.dt)}</div><div class="v ${c.dm>0?'neg':'pos'}">${c.dm>0?'-':'+'}${money(c.dm)}</div>`;
   else inner='<div class="v" style="color:#aaa">平時</div>'}
  const b=document.createElement('button');b.className='day'+(tp=='off'?' off':'')+(t.getFullYear()==y&&t.getMonth()==m&&t.getDate()==d?' today':'');
  b.innerHTML=`<div class="n">${d}</div>${inner}`;b.onclick=()=>openDay(k,`${m+1}月${d}日（${'日一二三四五六'[new Date(y,m,d).getDay()]}）`);gr.appendChild(b)}
 $('sMoney').textContent=money(TM);$('sTime').textContent=hm(TT);$('sTime').className=TT>=0?'pos':'neg';
 $('sRate').textContent=TT>0?money(TM/(TT/60))+' / 小時':'–';
 $('brk').innerHTML=['通勤','晚餐'].filter(n=>G[n].n).map(n=>`${n}：${G[n].n} 次，多花 ${money(G[n].dm)}，換回 ${hm(G[n].dt)}${G[n].dt>0?`，即每小時 ${money(G[n].dm/(G[n].dt/60))}`:''}`).join('<br>')}

function openDay(k,label){selKey=k;const r=S.days[k];dayType=r?r.type:defType(k);dayDraft=r&&r.type==dayType?JSON.parse(JSON.stringify(r.items)):{};
 $('mTitle').textContent=label;renderDay();$('modal').classList.add('on')}
function renderDay(){const b=S.base[dayType];$('dayTabs').querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x.dataset.t==dayType));
 $('dayForm').innerHTML=ITEMS.map(it=>{const v=dayDraft[it.k]||{},fast=!!v.fast;return `<div class="card"><h2>${it.lab[dayType]}</h2>
  <div class="opt" data-k="${it.k}"><button data-f="0" class="${fast?'':'sel'}">${it.slow}<small>照平時 ${money(b[it.k].amt)}・${hm(b[it.k].min)}</small></button><button data-f="1" class="${fast?'sel':''}">${it.fast}<small>省時做法</small></button></div>
  <div class="${fast?'':'hide'}" id="f${it.k}"><div class="row2"><div><label>${it.fast}消費（港元）</label><input id="d${it.k}a" type="number" inputmode="decimal" min="0" step="0.1" value="${v.amt??''}" placeholder="例如 ${it.k=='dinner'?'90':'80'}"></div></div>
  <label>所花時間</label>${timeInputs('d'+it.k+'t',v.min)}<div class="cmp" id="c${it.k}">輸入後會顯示和平時的差距</div></div></div>`}).join('');
 $('dayForm').querySelectorAll('.opt').forEach(o=>o.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{const k=o.dataset.k,f=btn.dataset.f=='1';
  o.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x==btn));$('f'+k).classList.toggle('hide',!f);dayDraft[k]=Object.assign(dayDraft[k]||{},{fast:f});live()}));
 $('dayErr').textContent='';$('dayClear').classList.toggle('hide',!S.days[selKey]);live()}
function live(){const b=S.base[dayType];let DM=0,DT=0,any=false;
 for(const it of ITEMS){if(!dayDraft[it.k]?.fast)continue;const a=readAmt('d'+it.k+'a'),t=readTime('d'+it.k+'t');
  if(a==null||t==null||isNaN(t)){$('c'+it.k).textContent='輸入後會顯示和平時的差距';continue}
  const dm=a-b[it.k].amt,dt=b[it.k].min-t;DM+=dm;DT+=dt;any=true;
  $('c'+it.k).innerHTML=`比${it.slow}<span class="${dm>0?'neg':'pos'}">${dm>0?'多花':'少花'} ${money(dm)}</span>，<span class="${dt>=0?'pos':'neg'}">${dt>=0?'省下':'多用'} ${hm(dt)}</span>${dt>0&&dm>0?`<br>等於每小時付 <b>${money(dm/(dt/60))}</b> 換時間`:''}`}
 $('dayTotal').innerHTML=any?`這天合共：<span class="${DM>0?'neg':'pos'}">${DM>0?'多花':'少花'} ${money(DM)}</span>，<span class="${DT>=0?'pos':'neg'}">${DT>=0?'換回':'多用'} ${hm(DT)}</span>${DT>0&&DM>0?`<br>平均每小時 ${money(DM/(DT/60))}`:''}`:'這天全部照平時做法，沒有多花錢，也沒有省時間。'}
$('dayForm').addEventListener('input',live);
$('dayTabs').querySelectorAll('button').forEach(x=>x.onclick=()=>{dayType=x.dataset.t;dayDraft={};renderDay()});
$('daySave').onclick=()=>{const items={};for(const it of ITEMS){const l=it.lab[dayType];if(!dayDraft[it.k]?.fast){items[it.k]={fast:false};continue}
  const a=readAmt('d'+it.k+'a'),t=readTime('d'+it.k+'t');if(a==null)return $('dayErr').textContent=`請輸入「${l}」${it.fast}的消費`;
  if(t==null)return $('dayErr').textContent=`請輸入「${l}」所花時間`;if(isNaN(t))return $('dayErr').textContent=`「${l}」的分鐘請輸入 0–59`;items[it.k]={fast:true,amt:a,min:t}}
 S.days[selKey]={type:dayType,items};persist();$('modal').classList.remove('on');render()};
$('dayClear').onclick=()=>{if(confirm('確定清除這天的紀錄？')){delete S.days[selKey];persist();$('modal').classList.remove('on');render()}};
$('close').onclick=()=>$('modal').classList.remove('on');$('modal').onclick=e=>{if(e.target.id=='modal')$('modal').classList.remove('on')};
$('prev').onclick=()=>{cur.setMonth(cur.getMonth()-1);render()};$('next').onclick=()=>{cur.setMonth(cur.getMonth()+1);render()};
$('editSet').onclick=showSetup;
(S.profile&&S.base)?showMain():showSetup();
</script></body></html>
